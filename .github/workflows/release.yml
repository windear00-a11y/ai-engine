name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: build and validate distributions
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - name: checkout
        uses: actions/checkout@v4
      - name: setup python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: build distributions
        run: |
          python -m pip install --upgrade pip
          pip install build
          python -m build --sdist --wheel --outdir dist
      - name: validate artifacts
        run: |
          python - <<'PY'
          import glob
          import tarfile
          import zipfile

          whl = glob.glob("dist/*.whl")[0]
          sdist = glob.glob("dist/*.tar.gz")[0]

          with zipfile.ZipFile(whl) as z:
              names = z.namelist()
              assert not any("/tests/" in n for n in names), "wheel must not contain tests"
              assert not any(n.endswith(".db") or "database/" in n for n in names), "no db in wheel"

          with tarfile.open(sdist) as t:
              names = t.getnames()
              assert not any(n.endswith(".db") or "database/" in n for n in names), "no db in sdist"

          print(f"validated: {whl}")
          print(f"validated: {sdist}")
          PY
      - name: upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/

  publish:
    name: publish to PyPI
    runs-on: ubuntu-latest
    needs: build
    environment: pypi
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - name: download distributions
        uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist
      - name: publish to PyPI (Trusted Publishing)
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist