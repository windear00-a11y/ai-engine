name: release

on:
  push:
    tags:
      - "v*"
permissions:
  contents: read

jobs:
  build:
    name: build and validate distributions
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - name: checkout
        uses: actions/checkout@v4
      - name: setup python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: assert frozen release commit (workflow_dispatch only)
        if: github.event_name == 'workflow_dispatch'
        run: |
          actual="$(git rev-parse HEAD)"
          expected="64f81c6e7ab8e4a2f615c5f116869b60e1529cc1"
          echo "checked out HEAD: ${actual}"
          if [ "${actual}" != "${expected}" ]; then
            echo "::error::checked-out commit ${actual} != frozen release commit ${expected}"
            exit 1
          fi
      - name: build distributions
        run: |
          python -m pip install --upgrade pip
          pip install build
          python -m build --sdist --wheel --outdir dist
      - name: verify package name and version
        run: |
          python - <<'PY'
          import glob
          import os
          import tarfile
          import zipfile

          event = os.environ["GITHUB_EVENT_NAME"]
          ref = os.environ["GITHUB_REF"]
          if event == "workflow_dispatch":
              expected_version = "0.10.0"
          else:
              prefix = "refs/tags/v"
              if not ref.startswith(prefix):
                  raise SystemExit(f"unexpected ref for tag trigger: {ref}")
              expected_version = ref[len(prefix):]

          whl = glob.glob("dist/*.whl")[0]
          sdist = glob.glob("dist/*.tar.gz")[0]

          def read_meta(text):
              name = version = None
              for line in text.splitlines():
                  if name is None and line.startswith("Name:"):
                      name = line.split(":", 1)[1].strip()
                  elif version is None and line.startswith("Version:"):
                      version = line.split(":", 1)[1].strip()
              return name, version

          with zipfile.ZipFile(whl) as z:
              meta = next(n for n in z.namelist() if n.endswith(".dist-info/METADATA"))
              name, version = read_meta(z.read(meta).decode())
              assert name == "kgheer-core", f"wheel name mismatch: {name}"
              assert version == expected_version, f"wheel version mismatch: {version} != {expected_version}"

          with tarfile.open(sdist) as t:
              pkg = next(n for n in t.getnames() if n.endswith("PKG-INFO"))
              name, version = read_meta(t.extractfile(pkg).read().decode())
              assert name == "kgheer-core", f"sdist name mismatch: {name}"
              assert version == expected_version, f"sdist version mismatch: {version} != {expected_version}"

          print(f"verified: name=kgheer-core version={expected_version} ({event})")
          PY
      - name: validate artifacts
        run: |
          python - <<'PY'
          import glob
          import tarfile
          import zipfile

          whl = glob.glob("dist/*.whl")[0]
          sdist = glob.glob("dist/*.tar.gz")[0]

          with zipfile.ZipFile(whl) as z:
              names = z.namelist()
              assert not any("/tests/" in n for n in names), "wheel must not contain tests"
              assert not any(n.endswith(".db") or "database/" in n for n in names), "no db in wheel"

          with tarfile.open(sdist) as t:
              names = t.getnames()
              assert not any(n.endswith(".db") or "database/" in n for n in names), "no db in sdist"

          print(f"validated: {whl}")
          print(f"validated: {sdist}")
          PY
      - name: upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/

  publish:
    name: publish to PyPI
    runs-on: ubuntu-latest
    needs: build
    environment: pypi
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - name: download distributions
        uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist
      - name: publish to PyPI (Trusted Publishing)
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist